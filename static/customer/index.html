<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Properties — True Fire Security</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      font-size: 1rem;
      font-weight: 800;
      color: #c0392b;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .signout-btn {
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      padding: 6px 14px;
      font-size: .82rem;
      font-weight: 500;
      color: #555;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }

    .signout-btn:hover { border-color: #c0392b; color: #c0392b; }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 36px 16px 60px;
    }

    .page-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
    }

    .page-subtitle {
      font-size: .88rem;
      color: #888;
      margin-bottom: 28px;
    }

    /* Loading / error / empty states */
    .state {
      text-align: center;
      padding: 60px 0;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #e5e7eb;
      border-top-color: #c0392b;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .state h2 { font-size: 1rem; font-weight: 600; color: #333; margin-bottom: 6px; }
    .state p  { font-size: .88rem; color: #888; }

    /* Property cards */
    .property-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
      padding: 24px;
      margin-bottom: 16px;
    }

    .property-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .property-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #111;
      line-height: 1.3;
    }

    .property-address {
      font-size: .85rem;
      color: #666;
      margin-top: 3px;
    }

    .badge {
      flex-shrink: 0;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .badge.pass {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .badge.fail {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .badge.none {
      background: #f3f4f6;
      color: #9ca3af;
      border: 1px solid #e5e7eb;
    }

    .inspection-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 20px;
      margin-bottom: 16px;
    }

    @media (max-width: 480px) {
      .inspection-fields { grid-template-columns: 1fr; }
      .property-card { padding: 18px; }
    }

    .field-label {
      font-size: .72rem;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 3px;
    }

    .field-value {
      font-size: .92rem;
      color: #222;
      font-weight: 500;
    }

    .view-btn {
      display: inline-block;
      padding: 8px 18px;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: .88rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s;
    }

    .view-btn:hover { background: #a93226; }

    .view-btn.disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: default;
      pointer-events: none;
    }
  </style>
</head>
<body>

<header>
  <span class="brand">True Fire Security</span>
  <button class="signout-btn" id="signout-btn">Sign Out</button>
</header>

<main>
  <div id="loading" class="state">
    <div class="spinner"></div>
    <h2>Loading your properties…</h2>
  </div>

  <div id="error" class="state" style="display:none;">
    <h2>Something went wrong</h2>
    <p id="error-msg"></p>
  </div>

  <div id="content" style="display:none;">
    <h1 class="page-title">My Properties</h1>
    <p class="page-subtitle" id="customer-name-sub"></p>
    <div id="property-list"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase-client.js"></script>
<script>
  function formatDate(dateStr) {
    if (!dateStr) return '—'
    const [year, month, day] = dateStr.split('-').map(Number)
    return new Date(year, month - 1, day).toLocaleDateString('en-US', {
      year: 'numeric', month: 'long', day: 'numeric'
    })
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none'
    document.getElementById('error-msg').textContent = msg
    document.getElementById('error').style.display = ''
  }

  document.getElementById('signout-btn').addEventListener('click', async function () {
    await supabaseClient.auth.signOut()
    window.location.replace('../internal/login.html')
  })

  window.addEventListener('load', async function () {
    const { data: { session } } = await supabaseClient.auth.getSession()
    if (!session) { window.location.replace('../internal/login.html'); return }

    // Load customer record
    const { data: customer, error: customerError } = await supabaseClient
      .from('customers')
      .select('id, full_name')
      .eq('user_id', session.user.id)
      .maybeSingle()

    if (customerError || !customer) {
      showError('Could not load your account. Please contact support.')
      return
    }

    // Load properties
    const { data: properties, error: propertiesError } = await supabaseClient
      .from('properties')
      .select('id, name, address')
      .eq('customer_id', customer.id)
      .order('name')

    if (propertiesError) { showError(propertiesError.message); return }

    document.getElementById('loading').style.display = 'none'
    document.getElementById('content').style.display = ''
    document.getElementById('customer-name-sub').textContent = customer.full_name

    const list = document.getElementById('property-list')

    if (!properties || properties.length === 0) {
      list.innerHTML = '<p style="color:#888;font-size:.9rem;">No properties found on your account.</p>'
      return
    }

    // For each property fetch most recent inspection
    await Promise.all(properties.map(async function (property) {
      const { data: inspections } = await supabaseClient
        .from('inspections')
        .select('id, inspection_date, next_due_date, status, pdf_url')
        .eq('property_id', property.id)
        .order('inspection_date', { ascending: false })
        .limit(1)

      const latest = inspections && inspections.length > 0 ? inspections[0] : null
      const status = latest ? (latest.status || '').toLowerCase() : null

      const card = document.createElement('div')
      card.className = 'property-card'

      const badgeClass = status === 'pass' ? 'pass' : status === 'fail' ? 'fail' : 'none'
      const badgeText  = status ? status.toUpperCase() : 'NO DATA'

      const hasReport = latest && latest.pdf_url
      const btnClass  = hasReport ? 'view-btn' : 'view-btn disabled'
      const btnAttrs  = hasReport
        ? 'href="' + latest.pdf_url + '" target="_blank" rel="noopener noreferrer"'
        : ''

      card.innerHTML =
        '<div class="property-header">' +
          '<div>' +
            '<div class="property-name">' + escHtml(property.name) + '</div>' +
            '<div class="property-address">' + escHtml(property.address || '') + '</div>' +
          '</div>' +
          '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
        '</div>' +
        '<div class="inspection-fields">' +
          '<div><div class="field-label">Last Inspection</div><div class="field-value">' + formatDate(latest ? latest.inspection_date : null) + '</div></div>' +
          '<div><div class="field-label">Next Due</div><div class="field-value">' + formatDate(latest ? latest.next_due_date : null) + '</div></div>' +
        '</div>' +
        '<a class="' + btnClass + '" ' + btnAttrs + '>View Report</a>'

      list.appendChild(card)
    }))
  })

  function escHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }
</script>
</body>
</html>
